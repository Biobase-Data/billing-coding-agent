name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Everything the build spec gates on lives in the pytest suite:
      # unit/contract tests, determinism tests, golden tests (every
      # produced line traces to a fact, every finding's rule_id
      # resolves), and the repo-wide CPT-descriptor guard. Repeatability
      # and rule-version replay are here too; repeatability skips itself
      # without ANTHROPIC_API_KEY (see pipeline/eval/test_repeatability.py).
      - name: Run test suite
        run: pytest -q

      - name: Run corpus evaluation and write report
        run: python -m pipeline.cli.eval

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: runs/eval_report.txt
